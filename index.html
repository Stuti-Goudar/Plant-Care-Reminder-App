<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plant Care Reminders</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>🌱 Plant Care Reminders</h1>
    <button id="enableBtn" class="notify-btn">Enable Notifications</button>
    <p id="permStatus" class="status">Notification status: Checking...</p>

    <div class="task">
      <label for="waterTime">💧 Water Time</label>
      <input type="time" id="waterTime" />
      <button onclick="setReminder('water')">Set</button>
      <span id="waterStatus" class="badge">Not set</span>
    </div>

    <div class="task">
      <label for="fertilizerTime">🧪 Fertilizer Time</label>
      <input type="time" id="fertilizerTime" />
      <button onclick="setReminder('fertilizer')">Set</button>
      <span id="fertilizerStatus" class="badge">Not set</span>
    </div>

    <div class="task">
      <label for="flowersTime">🌸 Flowers Care Time</label>
      <input type="time" id="flowersTime" />
      <button onclick="setReminder('flowers')">Set</button>
      <span id="flowersStatus" class="badge">Not set</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
